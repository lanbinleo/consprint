<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#201d22" media="(prefers-color-scheme: dark)" />
    <!-- Inter: self-hosted in /public/fonts via styles.css; Google Fonts acts as a backup source -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" />
    <title>AP Psych Hub</title>
    <script>
      // Apply theme before first paint: stored choice wins, else system preference.
      ;(function () {
        var stored = localStorage.getItem('apPsychTheme')
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
